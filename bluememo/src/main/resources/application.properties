spring.application.name=bluememo

server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

bluememo.jwt.secret=${JWT_SECRET}
bluememo.jwt.expiration-ms=${JWT_EXPIRATION_MS:15m}
bluememo.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
bluememo.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET}
bluememo.telegram.bot-token=${TELEGRAM_BOT_TOKEN}
bluememo.telegram.api-base-url=https://api.telegram.org/bot
bluememo.link.telegram-url=https://t.me/
bluememo.link.telegram-bot-name=${TELEGRAM_BOT_NAME}
