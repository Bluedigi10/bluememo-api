# API: conexión pooled
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway: conexión directa
spring.flyway.url=${FLYWAY_DATABASE_URL}
spring.flyway.user=${FLYWAY_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.flyway.password=${FLYWAY_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}

spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.bluedigi.bluememo=INFO

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.forward-headers-strategy=framework